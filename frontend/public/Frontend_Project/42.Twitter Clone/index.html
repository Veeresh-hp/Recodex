<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X / Twitter Web 2.0 — RecodeX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-layout">
      
      <!-- LEFT SIDEBAR -->
      <header class="left-sidebar">
        <div class="sidebar-inner">
          <div class="logo-container">
            <svg class="x-logo" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </div>

          <nav class="nav-links">
            <a href="#" class="nav-item active" data-tab="feed">
              <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 1.696L.622 8.807l1.06 1.696L3 9.679V20a2 2 0 002 2h4.5a.5.5 0 00.5-.5V15h4v6.5a.5.5 0 00.5.5H19a2 2 0 002-2V9.679l1.318.824 1.06-1.696L12 1.696z"/></svg>
              <span>Home</span>
            </a>
            <a href="#" class="nav-item" data-tab="explore">
              <svg viewBox="0 0 24 24" class="nav-icon"><path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"/></svg>
              <span>Explore</span>
            </a>
            <a href="#" class="nav-item" data-tab="notifications">
              <svg viewBox="0 0 24 24" class="nav-icon"><path d="M19.993 9.042C19.48 5.017 16.054 2 11.996 2s-7.49 3.021-7.999 7.051L2.866 18H7.1c.463 2.282 2.481 4 4.9 4s4.437-1.718 4.9-4h4.236l-1.143-8.958zM12 20c-1.306 0-2.417-.835-2.829-2h5.658c-.412 1.165-1.523 2-2.829 2zm-6.866-4l.847-6.696C6.376 6.079 8.915 4 12 4s5.624 2.079 6.019 5.305L18.866 16H5.134z"/></svg>
              <span>Notifications</span>
            </a>
            <a href="#" class="nav-item" data-tab="bookmarks">
              <svg viewBox="0 0 24 24" class="nav-icon"><path d="M4 4.5C4 3.12 5.119 2 6.5 2h11C18.881 2 20 3.12 20 4.5v17.91l-7.447-4.25-7.553 4.25V4.5zM6.5 4c-.276 0-.5.22-.5.5v14.47l5.447-3.07 5.553 3.07V4.5c0-.28-.224-.5-.5-.5h-11z"/></svg>
              <span>Bookmarks</span>
            </a>
            <a href="#" class="nav-item" data-tab="profile">
              <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 11.816c1.865 0 3.382-1.517 3.382-3.382S13.865 5.052 12 5.052s-3.382 1.517-3.382 3.382 1.517 3.382 3.382 3.382zm0-4.764c.762 0 1.382.62 1.382 1.382s-.62 1.382-1.382 1.382-1.382-.62-1.382-1.382.62-1.382 1.382-1.382zm5.72 9.536C16.89 14.654 14.59 13.5 12 13.5s-4.89 1.154-5.72 3.088c-.146.342-.016.74.305.928.322.188.736.1 1.01-.19.646-.68 2.37-1.826 4.405-1.826s3.76 1.146 4.406 1.826c.187.198.463.292.734.248.27-.044.5-.213.61-.466.146-.342.016-.74-.03-.928z"/></svg>
              <span>Profile</span>
            </a>
          </nav>

          <button id="quick-post-btn" class="sidebar-post-btn">
            <span>Post</span>
          </button>

          <!-- Current User Pill -->
          <div class="current-user-pill">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar" class="user-avatar" />
            <div class="user-meta">
              <span class="user-display-name">Alex Rivera</span>
              <span class="user-handle">@alex_dev</span>
            </div>
            <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Theme">
              <svg viewBox="0 0 24 24" class="theme-icon"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- MAIN TIMELINE -->
      <main class="main-content">
        <!-- Top Sticky Header -->
        <div class="timeline-header">
          <div class="header-tabs">
            <button class="tab-btn active" data-filter="for-you">For you</button>
            <button class="tab-btn" data-filter="following">Following</button>
          </div>
        </div>

        <!-- Compose Box -->
        <section class="compose-section">
          <div class="compose-avatar-col">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar" class="compose-avatar" />
          </div>
          <div class="compose-body">
            <textarea id="tweet-input" placeholder="What is happening?!" rows="3" maxlength="280"></textarea>
            
            <!-- Image URL Input Bar (Hidden by default) -->
            <div id="image-input-container" class="image-input-container hidden">
              <input type="url" id="tweet-image-url" placeholder="Paste image URL (e.g. https://images.unsplash.com/...)" />
              <button id="clear-image-btn" class="clear-img-btn">&times;</button>
            </div>
            <div id="image-preview" class="image-preview hidden"></div>

            <div class="compose-actions">
              <div class="compose-tools">
                <button type="button" id="tool-media" class="tool-btn" title="Add Image URL">
                  <svg viewBox="0 0 24 24"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3.293-3.293a1 1 0 0 1 1.414 0l1.543 1.543 4.293-4.293a1 1 0 0 1 1.414 0L19 11.043V5.5c0-.276-.224-.5-.5-.5h-13zM19 13.871l-3.25-3.25-4.293 4.293a1 1 0 0 1-1.414 0l-1.543-1.543L5 16.871V18.5c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-4.629zM8.5 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
                </button>
                <button type="button" id="tool-emoji" class="tool-btn" title="Add Emoji">
                  <svg viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm-3.5-9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm-3.5 6.5c2.33 0 4.31-1.55 4.95-3.72a.75.75 0 0 0-.72-.96H7.77a.75.75 0 0 0-.72.96c.64 2.17 2.62 3.72 4.95 3.72z"/></svg>
                </button>
                <button type="button" id="tool-tag" class="tool-btn" title="Insert #tech tag">
                  <svg viewBox="0 0 24 24"><path d="M19.75 8.25h-3.32l.85-3.41a.75.75 0 1 0-1.46-.36l-.94 3.77h-4.25l.85-3.41a.75.75 0 1 0-1.46-.36l-.94 3.77H5.25a.75.75 0 0 0 0 1.5h3.38l-1 4H4.25a.75.75 0 0 0 0 1.5h3.13l-.85 3.41a.75.75 0 1 0 1.46.36l.94-3.77h4.25l-.85 3.41a.75.75 0 1 0 1.46.36l.94-3.77h3.79a.75.75 0 0 0 0-1.5h-3.41l1-4h3.38a.75.75 0 0 0 0-1.5zm-5.78 5.5H9.72l1-4h4.25l-1 4z"/></svg>
                </button>
              </div>

              <div class="compose-right">
                <!-- Circular character counter -->
                <div class="char-count-wrapper">
                  <span id="char-count" class="char-count">280</span>
                </div>
                <button id="submit-tweet-btn" class="submit-tweet-btn" disabled>Post</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Feed List -->
        <div id="tweets-feed" class="tweets-feed">
          <!-- Dynamically Rendered Tweets -->
        </div>
      </main>

      <!-- RIGHT WIDGETS COLUMN -->
      <aside class="right-sidebar">
        <!-- Live Search -->
        <div class="search-widget">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"/></svg>
          <input type="text" id="feed-search" placeholder="Search posts, tags, developers..." />
          <button id="clear-search" class="clear-search-btn hidden">&times;</button>
        </div>

        <!-- Premium Banner -->
        <div class="widget-card premium-card">
          <h3>Subscribe to Premium</h3>
          <p>Subscribe to unlock new creator tools, ad revenue sharing, and enhanced feed reach.</p>
          <button class="btn-subscribe">Subscribe</button>
        </div>

        <!-- Trends for you -->
        <div class="widget-card">
          <h3 class="widget-title">What's happening</h3>
          <div class="trend-list" id="trend-list">
            <!-- Dynamically Rendered Trends -->
          </div>
        </div>

        <!-- Who to follow -->
        <div class="widget-card">
          <h3 class="widget-title">Who to follow</h3>
          <div class="follow-list" id="follow-list">
            <!-- Dynamically Rendered Recommended Users -->
          </div>
        </div>

        <!-- Footer terms -->
        <footer class="side-footer">
          <a href="#">Terms of Service</a>
          <a href="#">Privacy Policy</a>
          <a href="#">Cookie Policy</a>
          <span>© 2026 RecodeX Social</span>
        </footer>
      </aside>

    </div>

    <!-- Reply Modal Drawer -->
    <div id="reply-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <button id="close-reply-modal" class="close-modal-btn">&times;</button>
          <h4>Reply to post</h4>
        </div>
        <div id="reply-parent-tweet" class="modal-parent-tweet"></div>
        <div class="modal-reply-form">
          <textarea id="reply-input" placeholder="Post your reply" rows="3" maxlength="280"></textarea>
          <div class="modal-reply-actions">
            <span id="reply-char-count">280</span>
            <button id="submit-reply-btn" class="submit-tweet-btn" disabled>Reply</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="recodexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d1ff"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00d1ff" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Sleek rounded container for high visibility on dark and light tabs -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#07090e" stroke="url(#recodexGrad)" stroke-width="2.5" />
  
  <!-- Hexagon Outer Shape -->
  <polygon points="32,11 48,20 48,44 32,53 16,44 16,20" fill="none" stroke="url(#recodexGrad)" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Code symbol </> -->
  <path d="M25,25 L18,32 L25,39" fill="none" stroke="#00d1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M39,25 L46,32 L39,39" fill="none" stroke="#00d1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="34" y1="23" x2="30" y2="41" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>

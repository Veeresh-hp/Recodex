<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17. Chatting Web App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-app {
            width: 95vw;
            max-width: 1200px;
            height: 90vh;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            overflow: hidden;
            border: 1px solid #334155;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: #0f172a;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            padding: 12px 20px;
            border-bottom: 1px solid #334155;
        }

        .search-input-wrapper {
            position: relative;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .search-input {
            width: 100%;
            padding: 10px 10px 10px 36px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.875rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #38bdf8;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            gap: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            border-bottom: 1px solid #1e293b;
        }

        .contact-item:hover, .contact-item.active {
            background-color: #1e293b;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
            position: relative;
        }

        .online-badge {
            width: 12px;
            height: 12px;
            background-color: #22c55e;
            border: 2px solid #0f172a;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .contact-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 0.75rem;
            color: #64748b;
        }

        .contact-last-msg {
            font-size: 0.825rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b1329;
        }

        .chat-header {
            padding: 16px 24px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-user-details h3 {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .chat-user-details p {
            font-size: 0.8rem;
            color: #22c55e;
        }

        .chat-actions {
            display: flex;
            gap: 16px;
            color: #94a3b8;
            font-size: 1.2rem;
        }

        .chat-actions i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .chat-actions i:hover {
            color: #38bdf8;
        }

        .messages-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 65%;
        }

        .message-row.sent {
            align-self: flex-end;
        }

        .message-row.received {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.925rem;
            line-height: 1.45;
            position: relative;
            word-break: break-word;
        }

        .message-row.sent .message-bubble {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message-row.received .message-bubble {
            background-color: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 4px;
            align-self: flex-end;
        }

        .message-row.received .message-time {
            align-self: flex-start;
        }

        .chat-input-container {
            padding: 16px 24px;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 24px;
            color: #f8fafc;
            font-size: 0.925rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: #38bdf8;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            .contact-info, .search-box, .sidebar-header h2 span {
                display: none;
            }
            .sidebar-header {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="chat-app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-comments"></i> <span>ChatterApp</span></h2>
            </div>
            <div class="search-box">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="search-input" id="search-input" placeholder="Search chats...">
                </div>
            </div>
            <div class="contacts-list" id="contacts-list">
                <!-- Dynamic Contacts -->
            </div>
        </div>

        <!-- Main Chat -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="chat-user-info">
                    <div class="avatar" id="current-avatar">AI</div>
                    <div class="chat-user-details">
                        <h3 id="current-name">Sarah Connor</h3>
                        <p id="current-status"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> Online</p>
                    </div>
                </div>
                <div class="chat-actions">
                    <i class="fa-solid fa-phone"></i>
                    <i class="fa-solid fa-video"></i>
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </div>

            <div class="messages-container" id="messages-container">
                <!-- Dynamic Messages -->
            </div>

            <div class="chat-input-container">
                <i class="fa-regular fa-face-smile" style="color: #94a3b8; font-size: 1.25rem; cursor: pointer;"></i>
                <i class="fa-solid fa-paperclip" style="color: #94a3b8; font-size: 1.25rem; cursor: pointer;"></i>
                <input type="text" class="chat-input" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button class="send-btn" id="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const contacts = [
            { id: 1, name: 'Sarah Connor', avatar: 'SC', status: 'Online', lastMsg: 'Sounds good! See you tomorrow.', time: '10:42 AM', messages: [
                { sender: 'received', text: 'Hey there! How is the 50 projects challenge going?', time: '10:40 AM' },
                { sender: 'sent', text: 'It\'s going awesome! All 50 projects are running smoothly now.', time: '10:41 AM' },
                { sender: 'received', text: 'Sounds good! See you tomorrow.', time: '10:42 AM' }
            ]},
            { id: 2, name: 'Alex Tech Lead', avatar: 'AT', status: 'Online', lastMsg: 'The dashboard preview looks stunning!', time: '9:15 AM', messages: [
                { sender: 'received', text: 'Have you checked the latest code commit?', time: '9:10 AM' },
                { sender: 'sent', text: 'Yes, just reviewed it. Everything looks top notch.', time: '9:12 AM' },
                { sender: 'received', text: 'The dashboard preview looks stunning!', time: '9:15 AM' }
            ]},
            { id: 3, name: 'Design Team', avatar: 'DT', status: 'Online', lastMsg: 'Updated dark mode glassmorphism UI specs.', time: 'Yesterday', messages: [
                { sender: 'received', text: 'Updated dark mode glassmorphism UI specs.', time: 'Yesterday' }
            ]},
            { id: 4, name: 'John Doe', avatar: 'JD', status: 'Offline', lastMsg: 'Let me know when you host the projects.', time: 'Aug 19', messages: [
                { sender: 'received', text: 'Let me know when you host the projects.', time: 'Aug 19' }
            ]}
        ];

        let activeContactId = 1;

        const contactsListEl = document.getElementById('contacts-list');
        const messagesContainerEl = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const currentNameEl = document.getElementById('current-name');
        const currentAvatarEl = document.getElementById('current-avatar');

        function renderContacts() {
            contactsListEl.innerHTML = '';
            contacts.forEach(contact => {
                const item = document.createElement('div');
                item.className = `contact-item ${contact.id === activeContactId ? 'active' : ''}`;
                item.onclick = () => selectContact(contact.id);
                item.innerHTML = `
                    <div class="avatar">${contact.avatar}<div class="online-badge" style="display: ${contact.status === 'Online' ? 'block' : 'none'};"></div></div>
                    <div class="contact-info">
                        <div class="contact-top">
                            <div class="contact-name">${contact.name}</div>
                            <div class="contact-time">${contact.time}</div>
                        </div>
                        <div class="contact-last-msg">${contact.lastMsg}</div>
                    </div>
                `;
                contactsListEl.appendChild(item);
            });
        }

        function selectContact(id) {
            activeContactId = id;
            const contact = contacts.find(c => c.id === id);
            currentNameEl.textContent = contact.name;
            currentAvatarEl.textContent = contact.avatar;
            renderContacts();
            renderMessages();
        }

        function renderMessages() {
            const contact = contacts.find(c => c.id === activeContactId);
            messagesContainerEl.innerHTML = '';
            contact.messages.forEach(msg => {
                const row = document.createElement('div');
                row.className = `message-row ${msg.sender}`;
                row.innerHTML = `
                    <div class="message-bubble">${msg.text}</div>
                    <div class="message-time">${msg.time}</div>
                `;
                messagesContainerEl.appendChild(row);
            });
            messagesContainerEl.scrollTop = messagesContainerEl.scrollHeight;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const contact = contacts.find(c => c.id === activeContactId);
            contact.messages.push({ sender: 'sent', text: text, time: timeStr });
            contact.lastMsg = text;
            contact.time = timeStr;

            messageInput.value = '';
            renderContacts();
            renderMessages();

            // Simulate Bot Response after 1 sec
            setTimeout(() => {
                const responses = [
                    "That's awesome!",
                    "Got it, thanks for sharing!",
                    "Let's review this together soon.",
                    "Awesome work on this project!"
                ];
                const replyText = responses[Math.floor(Math.random() * responses.length)];
                contact.messages.push({ sender: 'received', text: replyText, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                contact.lastMsg = replyText;
                renderContacts();
                renderMessages();
            }, 1000);
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initialize
        renderContacts();
        renderMessages();
    </script>
</body>
</html>

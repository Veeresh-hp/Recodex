<!DOCTYPE html>
<html>
  <head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <div id="status" class="status">Player X's Turn</div>
    <table id="board">
      <tr>
        <td id="cell-0"></td>
        <td id="cell-1"></td>
        <td id="cell-2"></td>
      </tr>
      <tr>
        <td id="cell-3"></td>
        <td id="cell-4"></td>
        <td id="cell-5"></td>
      </tr>
      <tr>
        <td id="cell-6"></td>
        <td id="cell-7"></td>
        <td id="cell-8"></td>
      </tr>
    </table>
    <button id="reset-button">Reset</button>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <div id="social-icons">
        <a href="https://veereshhp.vercel.app/" target="_blank"><i class="fab fa-linkedin"></i></a>
        <a href="https://veereshhp.vercel.app/" target="_blank"><i class="fab fa-twitter"></i></a>
        <a href="https://veereshhp.vercel.app/" target="_blank"><i class="fab fa-github"></i></a>
        <a href="#">@Veeresh H P</a>
    </div>

    <div class="dropdown">
        <button class="dropbtn" id="dropbtn">Settings ⚙️</button>
        <div class="dropdown-content">
          <a href="#" id="opt-pvp" class="dropdown-item active">👥 2 Players (PvP)</a>
          <a href="#" id="opt-easy" class="dropdown-item">🤖 Easy AI</a>
          <a href="#" id="opt-medium" class="dropdown-item">🧠 Medium AI</a>
          <a href="#" id="opt-hard" class="dropdown-item">⚡ Hard AI</a>
          <div class="dropdown-divider"></div>
          <a href="#" id="opt-theme" class="dropdown-item">🎨 Change Theme</a>
        </div>
      </div>
      
    <script src="script.js"></script>
  </body>
</html>

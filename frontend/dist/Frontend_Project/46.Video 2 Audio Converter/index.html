<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>46. Video to Audio Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .drop-zone {
            border: 2px dashed #38bdf8;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            background-color: rgba(15, 23, 42, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background-color: rgba(56, 189, 248, 0.1);
            border-color: #60a5fa;
        }

        .drop-zone i {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 12px;
        }

        .drop-zone p {
            font-size: 1rem;
            color: #e2e8f0;
        }

        .drop-zone span {
            font-size: 0.825rem;
            color: #64748b;
            display: block;
            margin-top: 6px;
        }

        #file-input {
            display: none;
        }

        .preview-section {
            margin-top: 24px;
            display: none;
        }

        video {
            width: 100%;
            max-height: 240px;
            border-radius: 12px;
            background: #000;
            margin-bottom: 16px;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.5);
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #0f172a;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 16px;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.2s;
        }

        .output-section {
            margin-top: 24px;
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border: 1px solid #334155;
            display: none;
            text-align: center;
        }

        .output-section h3 {
            font-size: 1.1rem;
            color: #4ade80;
            margin-bottom: 12px;
        }

        audio {
            width: 100%;
            margin-bottom: 16px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: #22c55e;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-file-audio"></i> Video to Audio Converter</h1>
            <p>Convert any video file to high quality audio instantly in your browser</p>
        </header>

        <div class="drop-zone" id="drop-zone">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>Click to select or drag & drop video file</p>
            <span>Supports MP4, WEBM, MOV, AVI, MKV</span>
            <input type="file" id="file-input" accept="video/*">
        </div>

        <div class="preview-section" id="preview-section">
            <video id="video-preview" controls></video>
            <button class="action-btn" id="convert-btn">
                <i class="fa-solid fa-bolt"></i> Extract Audio Now
            </button>
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="output-section" id="output-section">
            <h3><i class="fa-solid fa-circle-check"></i> Conversion Complete!</h3>
            <audio id="audio-player" controls></audio>
            <br>
            <a href="#" class="download-btn" id="download-btn" download="extracted_audio.wav">
                <i class="fa-solid fa-download"></i> Download Audio
            </a>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewSection = document.getElementById('preview-section');
        const videoPreview = document.getElementById('video-preview');
        const convertBtn = document.getElementById('convert-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const outputSection = document.getElementById('output-section');
        const audioPlayer = document.getElementById('audio-player');
        const downloadBtn = document.getElementById('download-btn');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('video/')) {
                alert('Please upload a valid video file.');
                return;
            }
            selectedFile = file;
            const url = URL.createObjectURL(file);
            videoPreview.src = url;
            previewSection.style.display = 'block';
            outputSection.style.display = 'none';
        }

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            progressContainer.style.display = 'block';
            progressBar.style.width = '10%';
            convertBtn.disabled = true;
            convertBtn.textContent = 'Processing Audio...';

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                progressBar.style.width = '40%';
                
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                progressBar.style.width = '80%';

                const wavBlob = audioBufferToWav(audioBuffer);
                const audioUrl = URL.createObjectURL(wavBlob);

                progressBar.style.width = '100%';

                setTimeout(() => {
                    audioPlayer.src = audioUrl;
                    downloadBtn.href = audioUrl;
                    downloadBtn.download = `${selectedFile.name.replace(/\.[^/.]+$/, '')}.wav`;
                    outputSection.style.display = 'block';
                    progressContainer.style.display = 'none';
                    convertBtn.disabled = false;
                    convertBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> Extract Audio Now';
                }, 500);

            } catch (err) {
                console.error(err);
                alert('Could not decode audio track directly. Providing extracted webm audio stream.');
                // Fallback: Use MediaRecorder if Web Audio decoding fails
                const stream = videoPreview.captureStream ? videoPreview.captureStream() : videoPreview.mozCaptureStream();
                const audioTracks = stream.getAudioTracks();
                if (!audioTracks.length) {
                    alert('No audio track found in this video.');
                    return;
                }
                const audioStream = new MediaStream(audioTracks);
                const recorder = new MediaRecorder(audioStream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(blob);
                    audioPlayer.src = audioUrl;
                    downloadBtn.href = audioUrl;
                    downloadBtn.download = `${selectedFile.name.replace(/\.[^/.]+$/, '')}.webm`;
                    outputSection.style.display = 'block';
                };
                recorder.start();
                videoPreview.play();
                videoPreview.onended = () => recorder.stop();
            }
        });

        // Helper function to encode AudioBuffer into WAV format
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            let result;
            if (numChannels === 2) {
                result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
            } else {
                result = buffer.getChannelData(0);
            }

            return encodeWAV(result, numChannels, sampleRate, bitDepth);
        }

        function interleave(inputL, inputR) {
            const length = inputL.length + inputR.length;
            const result = new Float32Array(length);

            let index = 0;
            let inputIndex = 0;

            while (index < length) {
                result[index++] = inputL[inputIndex];
                result[index++] = inputR[inputIndex];
                inputIndex++;
            }
            return result;
        }

        function encodeWAV(samples, numChannels, sampleRate, bitDepth) {
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;

            const buffer = new ArrayBuffer(44 + samples.length * bytesPerSample);
            const view = new DataView(buffer);

            /* RIFF identifier */
            writeString(view, 0, 'RIFF');
            /* RIFF chunk length */
            view.setUint32(4, 36 + samples.length * bytesPerSample, true);
            /* RIFF type */
            writeString(view, 8, 'WAVE');
            /* format chunk identifier */
            writeString(view, 12, 'fmt ');
            /* format chunk length */
            view.setUint32(16, 16, true);
            /* sample format (raw) */
            view.setUint16(20, 1, true);
            /* channel count */
            view.setUint16(22, numChannels, true);
            /* sample rate */
            view.setUint32(24, sampleRate, true);
            /* byte rate (sample rate * block align) */
            view.setUint32(28, sampleRate * blockAlign, true);
            /* block align */
            view.setUint16(32, blockAlign, true);
            /* bits per sample */
            view.setUint16(34, bitDepth, true);
            /* data chunk identifier */
            writeString(view, 36, 'data');
            /* data chunk length */
            view.setUint32(40, samples.length * bytesPerSample, true);

            floatTo16BitPCM(view, 44, samples);

            return new Blob([view], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function floatTo16BitPCM(output, offset, input) {
            for (let i = 0; i < input.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, input[i]));
                output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
        }
    </script>
</body>
</html>

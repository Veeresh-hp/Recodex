<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake & Ladder Deluxe 🐍🪜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>

    <div class="app-wrapper">

        <!-- Top Header -->
        <header class="game-header">
            <div class="logo">
                <span class="logo-icon"><i class="fas fa-dice"></i></span>
                <h1>SNAKE & <span class="highlight">LADDER</span></h1>
            </div>

            <div class="header-controls">
                <div class="mode-selector">
                    <button class="mode-btn active" id="mode-2p" onclick="setGameMode('2p')">
                        <i class="fas fa-user-friends"></i> 2 Players
                    </button>
                    <button class="mode-btn" id="mode-cpu" onclick="setGameMode('cpu')">
                        <i class="fas fa-robot"></i> vs CPU
                    </button>
                </div>

                <button class="icon-btn" id="btn-sound" onclick="toggleSound()" title="Toggle Sound">
                    <i class="fas fa-volume-high"></i>
                </button>
                
                <button class="icon-btn" onclick="restartGame()" title="New Game">
                    <i class="fas fa-arrows-rotate"></i>
                </button>
            </div>
        </header>

        <!-- Main Workspace: Side Control Panel + Board -->
        <main class="main-layout">

            <!-- Control Sidebar -->
            <aside class="sidebar-panel">

                <!-- Player Cards -->
                <div class="players-box">
                    <div class="player-card card-p1 active" id="card-p1">
                        <div class="p-avatar red-avatar">
                            <i class="fas fa-chess-pawn"></i>
                        </div>
                        <div class="p-details">
                            <span class="p-name" id="name-p1">Player 1 (Red)</span>
                            <span class="p-pos" id="pos-p1">Tile: START</span>
                        </div>
                    </div>

                    <div class="player-card card-p2" id="card-p2">
                        <div class="p-details align-right">
                            <span class="p-name" id="name-p2">Player 2 (Yellow)</span>
                            <span class="p-pos" id="pos-p2">Tile: START</span>
                        </div>
                        <div class="p-avatar yellow-avatar" id="avatar-p2">
                            <i class="fas fa-chess-pawn"></i>
                        </div>
                    </div>
                </div>

                <!-- Turn HUD & Dice Box -->
                <div class="dice-section">
                    <div class="turn-label" id="turn-label">
                        <span class="turn-disc red" id="turn-disc"></span>
                        <span id="tog">Red's Turn</span>
                    </div>

                    <!-- 3D Animated Dice Container -->
                    <div class="dice-container" onclick="rollDice()">
                        <div class="dice-3d" id="dice-cube">
                            <div class="face front">1</div>
                            <div class="face back">6</div>
                            <div class="face right">3</div>
                            <div class="face left">4</div>
                            <div class="face top">5</div>
                            <div class="face bottom">2</div>
                        </div>
                    </div>

                    <button class="btn-roll" id="diceBtn" onclick="rollDice()">
                        <i class="fas fa-dice"></i> ROLL DICE
                    </button>
                </div>

                <!-- Recent Game Activity Log -->
                <div class="activity-log" id="activity-log">
                    <div class="log-entry">🎲 Welcome! Click ROLL DICE to start.</div>
                </div>

            </aside>

            <!-- Board Area -->
            <section class="board-container">
                <!-- SVG Connections Layer for Snakes & Ladders -->
                <svg class="svg-board-overlay" viewBox="0 0 1000 1000" id="svg-overlay" preserveAspectRatio="none">
                    <!-- SVG snakes & ladders will be rendered dynamically -->
                </svg>

                <!-- 10x10 Grid Cells -->
                <div class="board-grid" id="board-grid">
                    <!-- Cells b100 down to b1 inserted via JS -->
                </div>
            </section>

        </main>

    </div>

    <!-- Victory Modal -->
    <div class="modal-overlay" id="win-modal" style="display: none;">
        <div class="modal-card">
            <div class="modal-icon-wrap" id="modal-icon-wrap">
                <i class="fas fa-trophy"></i>
            </div>
            <h2 class="modal-title" id="modal-title">RED WON!</h2>
            <p class="modal-subtitle" id="modal-subtitle">Reached tile 100!</p>

            <div class="modal-stats">
                <div class="stat-item">
                    <span class="stat-lbl">Total Rolls</span>
                    <span class="stat-num" id="stat-rolls">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-lbl">Ladders Climbed</span>
                    <span class="stat-num" id="stat-ladders">0</span>
                </div>
            </div>

            <button class="btn-modal" onclick="restartGame()">
                <i class="fas fa-play"></i> PLAY AGAIN
            </button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>

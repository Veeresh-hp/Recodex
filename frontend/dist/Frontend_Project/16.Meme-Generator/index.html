<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Studio Pro 🎭 | Meme Generator & Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Impact&family=Montserrat:wght@700;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-wrapper">
        <main class="app-card">

            <!-- Left Controls Panel -->
            <section class="controls-panel">
                
                <!-- Logo -->
                <div class="logo">
                    <i class="fas fa-laugh-squint logo-icon"></i>
                    <h1>MEME<span class="highlight">STUDIO</span></h1>
                </div>

                <!-- Template Preset Chips -->
                <div class="row">
                    <label class="row-title"><i class="fas fa-fire"></i> Popular Templates</label>
                    <div class="template-chips">
                        <button class="chip active" onclick="loadTemplate('drake')">Drake</button>
                        <button class="chip" onclick="loadTemplate('doge')">Doge</button>
                        <button class="chip" onclick="loadTemplate('distracted')">Distracted</button>
                        <button class="chip" onclick="loadTemplate('buttons')">Two Buttons</button>
                        <button class="chip" onclick="loadTemplate('mind')">Change Mind</button>
                        <button class="chip" onclick="loadTemplate('success')">Success Kid</button>
                    </div>
                </div>

                <!-- Upload Custom Image -->
                <div class="row">
                    <label class="row-title"><i class="fas fa-cloud-arrow-up"></i> Custom Image</label>
                    <div class="file-upload-box" onclick="document.getElementById('imageFileInput').click()">
                        <i class="fas fa-image upload-icon"></i>
                        <span>Click or Drag & Drop Image</span>
                        <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
                    </div>
                </div>

                <!-- Text Inputs -->
                <div class="row">
                    <label class="row-title"><i class="fas fa-font"></i> Meme Captions</label>
                    <div class="input-group">
                        <i class="fas fa-arrow-up text-icon"></i>
                        <input type="text" id="topTextInput" placeholder="TOP TEXT..." value="WHEN YOU WRITE CLEAN CODE" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-arrow-down text-icon"></i>
                        <input type="text" id="bottomTextInput" placeholder="BOTTOM TEXT..." value="AND IT WORKS ON FIRST TRY" autocomplete="off">
                    </div>
                </div>

                <!-- Typography Options Grid -->
                <div class="row">
                    <label class="row-title"><i class="fas fa-sliders"></i> Typography Controls</label>

                    <div class="options-grid">
                        <div class="slider-box">
                            <div class="slider-header">
                                <span>Font Size</span>
                                <b id="font-size-val">45px</b>
                            </div>
                            <input type="range" id="font-size-slider" min="18" max="90" value="45">
                        </div>

                        <div class="opt-field">
                            <label>Font Family</label>
                            <select id="font-family">
                                <option value="Impact" selected>Impact (Classic)</option>
                                <option value="Montserrat">Montserrat</option>
                                <option value="Arial">Arial Black</option>
                                <option value="Fira Code">Fira Code</option>
                            </select>
                        </div>
                    </div>

                    <div class="colors-row">
                        <div class="color-picker-box">
                            <label>Text Color</label>
                            <div class="picker-wrapper">
                                <input type="color" id="text-color" value="#ffffff">
                            </div>
                        </div>

                        <div class="color-picker-box">
                            <label>Outline Color</label>
                            <div class="picker-wrapper">
                                <input type="color" id="stroke-color" value="#000000">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Download Button -->
                <button class="btn-download" id="downloadBtn" onclick="downloadMeme()">
                    <i class="fas fa-download"></i> Export Meme PNG
                </button>

            </section>

            <!-- Right Canvas Display Panel -->
            <section class="canvas-panel">
                <div class="canvas-frame">
                    <canvas id="meme"></canvas>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
